<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Phoenix — Interface</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: "Segoe UI", system-ui, sans-serif;
            background: #0f172a; color: #e2e8f0;
            margin: 0; height: 100vh; display: flex; flex-direction: column;
        }
        header {
            background: #1e293b; padding: .8rem 1.2rem;
            display: flex; align-items: center; justify-content: space-between;
            border-bottom: 1px solid #334155;
        }
        header h1 { margin: 0; font-size: 1.2rem; color: #38bdf8; }
        header .user { color: #94a3b8; font-size: .85rem; }
        header a { color: #38bdf8; font-size: .85rem; margin-left: 1rem; }
        main { flex: 1; display: flex; min-height: 0; }
        #chat {
            flex: 1; display: flex; flex-direction: column;
            padding: 1rem; min-width: 0;
        }
        #messages {
            flex: 1; overflow-y: auto; padding: 1rem;
            background: #1e293b; border-radius: 12px;
            display: flex; flex-direction: column; gap: .6rem;
        }
        .msg { max-width: 75%; padding: .6rem .9rem; border-radius: 10px; line-height: 1.4; }
        .msg.user { align-self: flex-end; background: #0ea5e9; color: #0f172a; }
        .msg.assistant { align-self: flex-start; background: #334155; color: #e2e8f0; }
        .msg .time { display: block; font-size: .7rem; opacity: .7; margin-top: .3rem; }
        #composer { display: flex; gap: .6rem; padding-top: .8rem; }
        #input {
            flex: 1; padding: .7rem;
            background: #0f172a; border: 1px solid #334155;
            border-radius: 8px; color: #e2e8f0; font-size: 1rem;
        }
        #send {
            padding: .7rem 1.4rem; background: #38bdf8;
            border: none; border-radius: 8px; color: #0f172a;
            font-weight: 600; cursor: pointer;
        }
        #send:hover { background: #0ea5e9; }
        aside {
            width: 280px; padding: 1rem; background: #1e293b;
            border-left: 1px solid #334155; overflow-y: auto;
        }
        aside h2 { font-size: .95rem; color: #94a3b8; margin: 0 0 1rem; }
        .stat { margin-bottom: .9rem; }
        .stat .label { color: #94a3b8; font-size: .8rem; }
        .stat .value { font-size: .95rem; color: #e2e8f0; word-break: break-word; }
        .pill {
            display: inline-block; padding: .15rem .6rem; border-radius: 999px;
            font-size: .75rem; font-weight: 600;
        }
        .pill.on { background: #22c55e33; color: #4ade80; border: 1px solid #22c55e; }
        .pill.off { background: #ef444433; color: #f87171; border: 1px solid #ef4444; }
        @media (max-width: 800px) {
            main { flex-direction: column; }
            aside { width: 100%; border-left: none; border-top: 1px solid #334155; }
        }
    </style>
</head>
<body>
    <header>
        <h1>Phoenix</h1>
        <div>
            <span class="user">Connecté : {{ username }}</span>
            <a href="/logout">Se déconnecter</a>
        </div>
    </header>
    <main>
        <div id="chat">
            <div id="messages"></div>
            <div id="composer">
                <input id="input" type="text" placeholder="Écris ton message à Phoenix..." autocomplete="off">
                <button id="send">Envoyer</button>
            </div>
        </div>
        <aside>
            <h2>Statut</h2>
            <div class="stat"><div class="label">Modèle</div><div class="value" id="s-model">—</div></div>
            <div class="stat"><div class="label">Voix (TTS)</div><div class="value" id="s-voice">—</div></div>
            <div class="stat"><div class="label">Wake word</div><div class="value" id="s-wake">—</div></div>
            <div class="stat"><div class="label">Pipeline</div><div id="s-pipeline" class="pill off">—</div></div>
            <div class="stat"><div class="label">À l'écoute</div><div id="s-listening" class="pill off">—</div></div>
        </aside>
    </main>

    <script>
        const messagesEl = document.getElementById('messages');
        const inputEl = document.getElementById('input');
        const sendEl = document.getElementById('send');

        function addMsg(role, text) {
            const div = document.createElement('div');
            div.className = 'msg ' + role;
            const t = new Date().toLocaleTimeString();
            div.innerHTML = text.replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\n/g, '<br>')
                + '<span class="time">' + t + '</span>';
            messagesEl.appendChild(div);
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        async function refresh() {
            try {
                const r = await fetch('/api/status');
                if (r.redirected) { window.location.href = r.url; return; }
                const s = await r.json();
                document.getElementById('s-model').textContent = s.model || '—';
                document.getElementById('s-voice').textContent = s.voice || '—';
                document.getElementById('s-wake').textContent = s.wake_word || '—';
                setPill('s-pipeline', s.pipeline_ready);
                setPill('s-listening', s.armed);
            } catch (e) { console.error(e); }
        }

        function setPill(id, on) {
            const el = document.getElementById(id);
            el.className = 'pill ' + (on ? 'on' : 'off');
            el.textContent = on ? 'Actif' : 'Inactif';
        }

        async function loadHistory() {
            try {
                const r = await fetch('/api/history');
                const hist = await r.json();
                messagesEl.innerHTML = '';
                for (const m of hist) addMsg(m.role, m.text);
            } catch (e) { console.error(e); }
        }

        async function send() {
            const text = inputEl.value.trim();
            if (!text) return;
            inputEl.value = '';
            addMsg('user', text);
            try {
                await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text }),
                });
            } catch (e) { console.error(e); }
        }

        sendEl.addEventListener('click', send);
        inputEl.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });

        loadHistory();
        refresh();
        setInterval(refresh, 3000);
    </script>
</body>
</html>
