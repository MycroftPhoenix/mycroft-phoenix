[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "mycroft-hub"
version = "1.0.0"
description = "Hub de communication interne Phoenix — pub/sub 100% mémoire, zéro réseau"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "Steve", email = "steve@phoenix-assistant.org"},
]
keywords = ["message-bus", "pubsub", "mycroft", "phoenix"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
]
requires-python = ">=3.10"

[project.urls]
Source = "https://github.com/steve/phoenix-assistant"

[tool.setuptools.packages.find]
where = ["../.."]
include = ["mycroft.hub*"]
namespaces = false
